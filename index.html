<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1206">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="鸡腿侠大战厨房电器军团 —— 原创像素横版射击平台小游戏，打开即玩。">
<link rel="icon" href="data:,">
<title>鸡腿侠大战厨房电器军团</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a0c06; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: absolute; display: block; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui { z-index: 2; }
  #touch { position: fixed; inset: 0; z-index: 5; display: none; pointer-events: none; }
  #touch > * { pointer-events: auto; }
  #stick { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: 18px; width: 128px; height: 128px; border-radius: 50%; background: rgba(255,240,220,0.14); border: 2px solid rgba(255,240,220,0.35); touch-action: none; }
  #knob { position: absolute; left: 39px; top: 39px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,207,58,0.75); border: 2px solid rgba(90,42,16,0.8); pointer-events: none; }
  .tbtn { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; font: bold 22px "PingFang SC","Microsoft YaHei",sans-serif; color: #5a2a10; background: rgba(255,244,220,0.7); border: 2px solid rgba(90,42,16,0.8); touch-action: none; }
  .tbtn.on { background: rgba(255,207,58,0.95); transform: scale(0.94); }
  .tbtn.lit { background: rgba(255,120,60,0.9); color: #fff; }
  #btnJump { right: max(18px, env(safe-area-inset-right)); bottom: 22px; width: 74px; height: 74px; }
  #btnFire { right: calc(max(18px, env(safe-area-inset-right)) + 86px); bottom: 50px; width: 74px; height: 74px; background: rgba(255,140,110,0.7); }
  #btnAuto { right: calc(max(18px, env(safe-area-inset-right)) + 60px); bottom: 140px; width: 52px; height: 52px; font-size: 14px; }
  #btnPause { right: max(12px, env(safe-area-inset-right)); top: 10px; width: 40px; height: 40px; font-size: 14px; }
  #btnMute { right: calc(max(12px, env(safe-area-inset-right)) + 48px); top: 10px; width: 40px; height: 40px; font-size: 16px; }
  #rotate { display: none; position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; color: #ffcf9a; font: 13px sans-serif; z-index: 1; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
</style>
</head>
<body>
<canvas id="game" width="480" height="272"></canvas>
<canvas id="ui"></canvas>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="btnJump" class="tbtn">跳</div>
  <div id="btnFire" class="tbtn">射</div>
  <div id="btnAuto" class="tbtn">连发</div>
  <div id="btnPause" class="tbtn">❚❚</div>
  <div id="btnMute" class="tbtn">🔊</div>
</div>
<div id="rotate">📱 横屏体验更佳</div>
<script src="js/core.js"></script>
<script src="js/level.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
</body>
</html>
